
services:
  ps5-live-bridge:
    image: ghcr.io/icenoproblem/ps5livebridge:latest
    container_name: ps5-live-bridge
    restart: unless-stopped

    network_mode: host

    init: true

    volumes:
      - ./data:/data

    environment:
      TZ: "Asia/Shanghai"

      PS5LB_LAN_IP: ""

      PS5LB_WEB_PORT: "5000"

      PS5LB_STAT_PORT: "8099"

    stop_grace_period: 30s

  watchtower:
    image: containrrr/watchtower
    container_name: ps5-watchtower
    profiles: ["auto-update"]
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DOCKER_API_VERSION: "1.44"
    command: --schedule "0 0 4 * * *" --cleanup ps5-live-bridge
