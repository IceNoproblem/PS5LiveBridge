# nginx-rtmp配置文件
# 由PS5-Bilibili-Danmaku自动生成
# 优化版本 - 提升画质和稳定性

worker_processes  1;
error_log  logs/error.log;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

rtmp {
    server {
        listen 1935;
        # 增大chunk_size减少碎片，提升传输效率
        chunk_size 8192;

        application app {
            live on;
            record off;

            # 启用交错模式，优化音视频同步
            interleave on;

            # 半开/断线的推流会话必须尽快释放流名。
            # nginx-rtmp 同一个流名只允许一个 publisher，残留会话占着名字时，
            # PS5 重连 publish 会被拒（NetStream.Publish.BadName），
            # 界面上就显示「有其他设备正在向该频道直播」。
            drop_idle_publisher 5s;

            # 关键帧间隔控制（秒），推荐2秒一个关键帧
            # 注意：这个值应该与推流端设置匹配
            # keyframe_interval 2s;

            # 启用HLS切片（可选，如果需要网页播放）
            # hls on;
            # hls_path html/hls;
            # hls_fragment 2s;
            # hls_playlist_length 10s;

            # 推流缓冲区设置
            # 推流端缓冲区
            publish_notify on;
            
            # 播放端缓冲区 - 适当增大减少卡顿
            # 格式: play <path> [options]
            # wait_key on;  # 等待关键帧后开始播放
            
            # 允许跨域播放
            allow play all;
        }
    }
}

http {
    server {
        listen 8080;
        location / {
            root html;
            index index.html;
        }

        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }

        location /stat.xsl {
            root html;
        }

    }
}
